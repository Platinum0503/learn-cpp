<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ Visualizer - Dieu kien</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Be Vietnam Pro', sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .container {
    width: 100%;
    max-width: 860px;
    background: #1a1d2e;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #2d3154;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: #13152a;
    border-bottom: 1px solid #2d3154;
    flex-wrap: wrap;
  }

  .toolbar-title {
    font-size: 13px;
    font-weight: 600;
    color: #a78bfa;
    letter-spacing: 0.05em;
    margin-right: 4px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 500;
    transition: all 0.15s;
  }

  .btn-icon {
    padding: 6px 10px;
    background: #2d3154;
    color: #94a3b8;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .btn-icon:hover { background: #3d4270; color: #e2e8f0; }

  .btn-play {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: white;
    box-shadow: 0 4px 12px rgba(124,58,237,0.4);
  }
  .btn-play:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124,58,237,0.5); }

  .speed-label {
    font-size: 12px;
    color: #64748b;
    margin-left: 4px;
  }

  .speed-select {
    background: #2d3154;
    color: #e2e8f0;
    border: 1px solid #3d4270;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: 'Be Vietnam Pro', sans-serif;
    cursor: pointer;
  }

  .step-counter {
    margin-left: auto;
    font-size: 12px;
    color: #64748b;
    font-family: 'JetBrains Mono', monospace;
    background: #2d3154;
    padding: 5px 10px;
    border-radius: 6px;
  }

  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 320px;
  }

  .code-panel {
    border-right: 1px solid #2d3154;
    overflow: hidden;
  }

  .code-lines {
    padding: 12px 0;
  }

  .code-line {
    display: flex;
    align-items: center;
    padding: 3px 0;
    transition: background 0.2s;
    border-left: 3px solid transparent;
  }

  .code-line.active {
    background: rgba(124, 58, 237, 0.15);
    border-left-color: #a855f7;
  }

  .line-num {
    width: 40px;
    text-align: right;
    padding-right: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #374151;
    flex-shrink: 0;
    user-select: none;
  }

  .code-line.active .line-num { color: #7c3aed; }

  .line-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #cbd5e1;
    white-space: pre;
  }

  .kw { color: #c084fc; }
  .fn { color: #60a5fa; }
  .nu { color: #fb923c; }
  .st { color: #4ade80; }
  .cm { color: #475569; font-style: italic; }
  .op { color: #94a3b8; }

  .info-panel {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #a855f7;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #a855f7;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .explanation {
    font-size: 13.5px;
    line-height: 1.7;
    color: #cbd5e1;
  }

  .vars-title {
    font-size: 11px;
    font-weight: 600;
    color: #475569;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .vars-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .var-chip {
    background: #2d3154;
    border: 1px solid #3d4270;
    border-radius: 8px;
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .var-name { color: #60a5fa; }
  .var-eq { color: #475569; margin: 0 4px; }
  .var-val { color: #fb923c; font-weight: 700; }

  .output-box {
    background: #0f1117;
    border: 1px solid #2d3154;
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #4ade80;
    min-height: 40px;
  }

  .output-label {
    font-size: 11px;
    color: #475569;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .slider-bar {
    padding: 12px 16px;
    background: #13152a;
    border-top: 1px solid #2d3154;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .slider-bar input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: #2d3154;
    border-radius: 2px;
    outline: none;
  }

  .slider-bar input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #7c3aed;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(124,58,237,0.6);
  }

  .slider-label { font-size: 11px; color: #475569; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="container">
  <div class="toolbar">
    <span class="toolbar-title">⚡ Trực quan hoá</span>
    <button class="btn-icon" onclick="goFirst()" title="Đầu">⏮</button>
    <button class="btn-icon" onclick="goPrev()" title="Trước">◀</button>
    <button class="btn btn-play" onclick="togglePlay()" id="playBtn">▶ Chạy</button>
    <button class="btn-icon" onclick="goNext()" title="Tiếp">▶</button>
    <span class="speed-label">Tốc độ</span>
    <select class="speed-select" id="speedSelect">
      <option value="1200">🐢 Chậm</option>
      <option value="700" selected>⚡ Bình thường</option>
      <option value="300">🚀 Nhanh</option>
    </select>
    <span class="step-counter" id="stepCounter">1 / 1</span>
  </div>

  <div class="main">
    <div class="code-panel">
      <div class="code-lines" id="codeLines"></div>
    </div>
    <div class="info-panel">
      <div class="status-badge"><div class="status-dot"></div><span id="statusTxt">ĐANG THỰC THI</span></div>
      <div class="explanation" id="explanation">Chọn bước để bắt đầu.</div>
      <div class="vars-title">Biến số</div>
      <div class="vars-grid" id="varsGrid"></div>
      <div class="output-label">Output</div>
      <div class="output-box" id="outputBox"></div>
    </div>
  </div>

  <div class="slider-bar">
    <span class="slider-label" id="sliderMin">0</span>
    <input type="range" id="slider" min="0" value="0" oninput="goToStep(parseInt(this.value))">
    <span class="slider-label" id="sliderMax">0</span>
  </div>
</div>

<script>
const STEPS = [
  {
    line: 1,
    explain: "Nạp thư viện <b>iostream</b> — cung cấp <code>cout</code> và <code>cin</code>.",
    vars: {},
    output: ""
  },
  {
    line: 2,
    explain: "Khai báo <b>using namespace std</b> — giúp dùng <code>cout</code> không cần viết <code>std::</code>.",
    vars: {},
    output: ""
  },
  {
    line: 4,
    explain: "Bắt đầu hàm <b>main()</b> — điểm khởi chạy của chương trình.",
    vars: {},
    output: ""
  },
  {
    line: 5,
    explain: "Khai báo biến <b>diem = 7</b>.",
    vars: { diem: 7 },
    output: ""
  },
  {
    line: 6,
    explain: "Kiểm tra điều kiện <b>diem &gt;= 8</b>: 7 ≥ 8 → <span style='color:#ef4444'>✗ Sai</span>, bỏ qua nhánh này.",
    vars: { diem: 7 },
    output: ""
  },
  {
    line: 8,
    explain: "Kiểm tra <b>else if (diem &gt;= 6)</b>: 7 ≥ 6 → <span style='color:#4ade80'>✓ Đúng</span>, vào nhánh này.",
    vars: { diem: 7 },
    output: ""
  },
  {
    line: 9,
    explain: "In ra chuỗi <b>\"Kha\"</b>. Các nhánh <code>else</code> còn lại bị bỏ qua hoàn toàn.",
    vars: { diem: 7 },
    output: "Kha"
  },
  {
    line: 13,
    explain: "Hàm <b>return 0</b> — kết thúc chương trình thành công.",
    vars: { diem: 7 },
    output: "Kha"
  },
  {
    line: 14,
    explain: "✅ <b>Chương trình kết thúc!</b> Vì diem = 7 nằm trong khoảng 6-7 nên in ra \"Kha\".",
    vars: { diem: 7 },
    output: "Kha"
  }
];

const CODE = [
  { text: '#include <iostream>', html: '<span class="kw">#include</span> <span class="st">&lt;iostream&gt;</span>' },
  { text: 'using namespace std;', html: '<span class="kw">using namespace</span> std;' },
  { text: '', html: '' },
  { text: 'int main() {', html: '<span class="kw">int</span> <span class="fn">main</span>() {' },
  { text: '    int diem = 7;', html: '    <span class="kw">int</span> diem = <span class="nu">7</span>;' },
  { text: '    if (diem >= 8) {', html: '    <span class="kw">if</span> (diem <span class="op">&gt;=</span> <span class="nu">8</span>) {' },
  { text: '        cout << "Gioi";', html: '        <span class="fn">cout</span> <span class="op">&lt;&lt;</span> <span class="st">"Gioi"</span>;' },
  { text: '    } else if (diem >= 6) {', html: '    } <span class="kw">else if</span> (diem <span class="op">&gt;=</span> <span class="nu">6</span>) {' },
  { text: '        cout << "Kha";', html: '        <span class="fn">cout</span> <span class="op">&lt;&lt;</span> <span class="st">"Kha"</span>;' },
  { text: '    } else {', html: '    } <span class="kw">else</span> {' },
  { text: '        cout << "Trung binh";', html: '        <span class="fn">cout</span> <span class="op">&lt;&lt;</span> <span class="st">"Trung binh"</span>;' },
  { text: '    }', html: '    }' },
  { text: '    return 0;', html: '    <span class="kw">return</span> <span class="nu">0</span>;' },
  { text: '}', html: '}' },
];

let current = 0;
let playing = false;
let timer = null;

function renderCode() {
  const el = document.getElementById('codeLines');
  el.innerHTML = CODE.map((line, i) => `
    <div class="code-line" id="line-${i+1}">
      <span class="line-num">${i+1}</span>
      <span class="line-code">${line.html || '&nbsp;'}</span>
    </div>
  `).join('');
}

function renderStep(idx) {
  const step = STEPS[idx];
  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  const activeLine = document.getElementById('line-' + step.line);
  if (activeLine) {
    activeLine.classList.add('active');
    activeLine.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  document.getElementById('explanation').innerHTML = step.explain;
  document.getElementById('outputBox').textContent = step.output;
  const grid = document.getElementById('varsGrid');
  grid.innerHTML = Object.entries(step.vars).map(([k,v]) =>
    `<div class="var-chip"><span class="var-name">${k}</span><span class="var-eq">=</span><span class="var-val">${v}</span></div>`
  ).join('') || '<span style="color:#374151;font-size:12px">Chưa có biến</span>';
  document.getElementById('stepCounter').textContent = `${idx+1} / ${STEPS.length}`;
  document.getElementById('slider').value = idx;
}

function goToStep(idx) {
  current = Math.max(0, Math.min(STEPS.length - 1, idx));
  renderStep(current);
}

function goNext() {
  if (current < STEPS.length - 1) goToStep(current + 1);
  else stopPlay();
}

function goPrev() { goToStep(current - 1); }
function goFirst() { goToStep(0); }

function togglePlay() {
  playing ? stopPlay() : startPlay();
}

function startPlay() {
  playing = true;
  document.getElementById('playBtn').textContent = '⏸ Dừng';
  const speed = parseInt(document.getElementById('speedSelect').value);
  timer = setInterval(() => {
    if (current >= STEPS.length - 1) { stopPlay(); return; }
    goNext();
  }, speed);
}

function stopPlay() {
  playing = false;
  clearInterval(timer);
  document.getElementById('playBtn').textContent = '▶ Chạy';
}

renderCode();
const slider = document.getElementById('slider');
slider.max = STEPS.length - 1;
document.getElementById('sliderMax').textContent = STEPS.length - 1;
goToStep(0);
</script>
</body>
</html>
