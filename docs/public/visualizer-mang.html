<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mảng Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Be Vietnam Pro', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .container { width: 100%; max-width: 900px; background: #1a1d2e; border-radius: 16px; overflow: hidden; border: 1px solid #2d3154; box-shadow: 0 24px 64px rgba(0,0,0,0.5); }
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #13152a; border-bottom: 1px solid #2d3154; flex-wrap: wrap; }
  .toolbar-title { font-size: 13px; font-weight: 600; color: #f59e0b; letter-spacing: 0.05em; }
  .btn-icon { padding: 6px 10px; background: #2d3154; color: #94a3b8; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; transition: all 0.15s; }
  .btn-icon:hover { background: #3d4270; color: #e2e8f0; }
  .btn-play { padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 500; background: linear-gradient(135deg, #b45309, #f59e0b); color: white; box-shadow: 0 4px 12px rgba(180,83,9,0.4); transition: all 0.15s; }
  .btn-play:hover { transform: translateY(-1px); }
  .speed-label { font-size: 12px; color: #64748b; margin-left: 4px; }
  .speed-select { background: #2d3154; color: #e2e8f0; border: 1px solid #3d4270; border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: 'Be Vietnam Pro', sans-serif; cursor: pointer; }
  .step-counter { margin-left: auto; font-size: 12px; color: #64748b; font-family: 'JetBrains Mono', monospace; background: #2d3154; padding: 5px 10px; border-radius: 6px; }
  .main { display: grid; grid-template-columns: 1fr 1fr; min-height: 360px; }
  .code-panel { border-right: 1px solid #2d3154; overflow: hidden; }
  .code-lines { padding: 12px 0; }
  .code-line { display: flex; align-items: center; padding: 3px 0; transition: background 0.2s; border-left: 3px solid transparent; }
  .code-line.active { background: rgba(245,158,11,0.12); border-left-color: #f59e0b; }
  .line-num { width: 40px; text-align: right; padding-right: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #374151; flex-shrink: 0; user-select: none; }
  .code-line.active .line-num { color: #b45309; }
  .line-code { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #cbd5e1; white-space: pre; }
  .kw { color: #c084fc; } .fn { color: #60a5fa; } .nu { color: #fb923c; } .st { color: #4ade80; }
  .info-panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .status-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #f59e0b; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .explanation { font-size: 13px; line-height: 1.7; color: #cbd5e1; }
  .section-title { font-size: 11px; font-weight: 600; color: #475569; letter-spacing: 0.08em; text-transform: uppercase; }

  /* Array visualization */
  .array-container { display: flex; flex-direction: column; gap: 8px; }
  .array-row { display: flex; align-items: center; gap: 4px; }
  .array-cell {
    width: 44px; height: 44px; background: #2d3154; border: 1px solid #3d4270;
    border-radius: 6px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; transition: all 0.3s; flex-shrink: 0;
  }
  .array-cell.active { border-color: #f59e0b; background: rgba(245,158,11,0.2); transform: translateY(-3px); box-shadow: 0 4px 12px rgba(245,158,11,0.3); }
  .array-cell.visited { border-color: #34d399; background: rgba(52,211,153,0.1); }
  .cell-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: #fb923c; }
  .cell-idx { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #475569; }

  .vars-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .var-chip { background: #2d3154; border: 1px solid #3d4270; border-radius: 6px; padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .var-name { color: #60a5fa; } .var-eq { color: #475569; margin: 0 3px; } .var-val { color: #fb923c; font-weight: 700; }

  .output-label { font-size: 11px; color: #475569; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .output-box { background: #0f1117; border: 1px solid #2d3154; border-radius: 8px; padding: 10px 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #4ade80; min-height: 36px; }

  .slider-bar { padding: 12px 16px; background: #13152a; border-top: 1px solid #2d3154; display: flex; align-items: center; gap: 10px; }
  .slider-bar input[type=range] { flex: 1; -webkit-appearance: none; height: 4px; background: #2d3154; border-radius: 2px; outline: none; }
  .slider-bar input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #b45309; cursor: pointer; box-shadow: 0 0 8px rgba(180,83,9,0.6); }
  .slider-label { font-size: 11px; color: #475569; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="container">
  <div class="toolbar">
    <span class="toolbar-title">📦 Mảng - Array</span>
    <button class="btn-icon" onclick="goFirst()">⏮</button>
    <button class="btn-icon" onclick="goPrev()">◀</button>
    <button class="btn-play" onclick="togglePlay()" id="playBtn">▶ Chạy</button>
    <button class="btn-icon" onclick="goNext()">▶</button>
    <span class="speed-label">Tốc độ</span>
    <select class="speed-select" id="speedSelect">
      <option value="1500">🐢 Chậm</option>
      <option value="800" selected>⚡ Bình thường</option>
      <option value="350">🚀 Nhanh</option>
    </select>
    <span class="step-counter" id="stepCounter">1 / 1</span>
  </div>

  <div class="main">
    <div class="code-panel">
      <div class="code-lines" id="codeLines"></div>
    </div>
    <div class="info-panel">
      <div class="status-badge"><div class="status-dot"></div><span>ĐANG THỰC THI</span></div>
      <div class="explanation" id="explanation"></div>
      <div class="section-title">Mảng trong bộ nhớ</div>
      <div class="array-container">
        <div class="array-row" id="arrayRow"></div>
      </div>
      <div class="section-title">Biến số</div>
      <div class="vars-row" id="varsRow"></div>
      <div class="output-label">Output</div>
      <div class="output-box" id="outputBox"></div>
    </div>
  </div>

  <div class="slider-bar">
    <span class="slider-label">0</span>
    <input type="range" id="slider" min="0" value="0" oninput="goToStep(parseInt(this.value))">
    <span class="slider-label" id="sliderMax">0</span>
  </div>
</div>

<script>
const ARR = [10, 20, 30, 40, 50];

const CODE = [
  { html: '<span class="kw">#include</span> <span class="st">&lt;iostream&gt;</span>' },
  { html: '<span class="kw">using namespace</span> std;' },
  { html: '' },
  { html: '<span class="kw">int</span> <span class="fn">main</span>() {' },
  { html: '    <span class="kw">int</span> arr[<span class="nu">5</span>] = {<span class="nu">10</span>, <span class="nu">20</span>, <span class="nu">30</span>, <span class="nu">40</span>, <span class="nu">50</span>};' },
  { html: '    <span class="kw">int</span> tong = <span class="nu">0</span>;' },
  { html: '' },
  { html: '    <span class="kw">for</span> (<span class="kw">int</span> i = <span class="nu">0</span>; i &lt; <span class="nu">5</span>; i++) {' },
  { html: '        tong += arr[i];' },
  { html: '    }' },
  { html: '' },
  { html: '    <span class="fn">cout</span> &lt;&lt; <span class="st">"Tong: "</span> &lt;&lt; tong &lt;&lt; endl;' },
  { html: '    <span class="kw">return</span> <span class="nu">0</span>;' },
  { html: '}' },
];

const STEPS = [
  { line: 4, explain: "Bắt đầu hàm <b>main()</b>.", active: -1, visited: [], vars: {}, output: "" },
  { line: 5, explain: "Khai báo mảng <b>arr[5]</b> với 5 phần tử.<br>→ Máy tính cấp 5 ô nhớ liên tiếp.", active: -1, visited: [0,1,2,3,4], vars: {}, output: "" },
  { line: 6, explain: "Khai báo <b>tong = 0</b> để tính tổng.", active: -1, visited: [0,1,2,3,4], vars: { tong: 0 }, output: "" },
  { line: 8, explain: "Bắt đầu vòng lặp, <b>i = 0</b>. Kiểm tra i &lt; 5 → Đúng.", active: -1, visited: [0,1,2,3,4], vars: { i: 0, tong: 0 }, output: "" },
  { line: 9, explain: "<b>arr[0] = 10</b>. tong += 10 → tong = <span style='color:#fb923c'>10</span>.", active: 0, visited: [0,1,2,3,4], vars: { i: 0, tong: 10 }, output: "" },
  { line: 8, explain: "<b>i = 1</b>. Kiểm tra i &lt; 5 → Đúng.", active: -1, visited: [0,1,2,3,4], vars: { i: 1, tong: 10 }, output: "" },
  { line: 9, explain: "<b>arr[1] = 20</b>. tong += 20 → tong = <span style='color:#fb923c'>30</span>.", active: 1, visited: [0,1,2,3,4], vars: { i: 1, tong: 30 }, output: "" },
  { line: 8, explain: "<b>i = 2</b>. Kiểm tra i &lt; 5 → Đúng.", active: -1, visited: [0,1,2,3,4], vars: { i: 2, tong: 30 }, output: "" },
  { line: 9, explain: "<b>arr[2] = 30</b>. tong += 30 → tong = <span style='color:#fb923c'>60</span>.", active: 2, visited: [0,1,2,3,4], vars: { i: 2, tong: 60 }, output: "" },
  { line: 8, explain: "<b>i = 3</b>. Kiểm tra i &lt; 5 → Đúng.", active: -1, visited: [0,1,2,3,4], vars: { i: 3, tong: 60 }, output: "" },
  { line: 9, explain: "<b>arr[3] = 40</b>. tong += 40 → tong = <span style='color:#fb923c'>100</span>.", active: 3, visited: [0,1,2,3,4], vars: { i: 3, tong: 100 }, output: "" },
  { line: 8, explain: "<b>i = 4</b>. Kiểm tra i &lt; 5 → Đúng.", active: -1, visited: [0,1,2,3,4], vars: { i: 4, tong: 100 }, output: "" },
  { line: 9, explain: "<b>arr[4] = 50</b>. tong += 50 → tong = <span style='color:#fb923c'>150</span>.", active: 4, visited: [0,1,2,3,4], vars: { i: 4, tong: 150 }, output: "" },
  { line: 8, explain: "<b>i = 5</b>. Kiểm tra i &lt; 5 → <span style='color:#ef4444'>Sai</span>, thoát vòng lặp.", active: -1, visited: [0,1,2,3,4], vars: { i: 5, tong: 150 }, output: "" },
  { line: 12, explain: "In kết quả: <b>Tong = 150</b>.", active: -1, visited: [0,1,2,3,4], vars: { i: 5, tong: 150 }, output: "Tong: 150" },
  { line: 13, explain: "✅ <b>Chương trình kết thúc!</b><br><br>Tóm tắt:<br>• Mảng lưu nhiều phần tử cùng kiểu<br>• Chỉ số bắt đầu từ 0<br>• arr[i] truy cập phần tử thứ i", active: -1, visited: [0,1,2,3,4], vars: { i: 5, tong: 150 }, output: "Tong: 150" },
];

let current = 0, playing = false, timer = null;

function renderCode() {
  document.getElementById('codeLines').innerHTML = CODE.map((line, i) => `
    <div class="code-line" id="line-${i+1}">
      <span class="line-num">${i+1}</span>
      <span class="line-code">${line.html || '&nbsp;'}</span>
    </div>
  `).join('');
}

function renderArray(activeIdx, visitedIdxs) {
  document.getElementById('arrayRow').innerHTML = ARR.map((val, i) => `
    <div class="array-cell ${activeIdx === i ? 'active' : visitedIdxs.includes(i) ? 'visited' : ''}">
      <span class="cell-val">${val}</span>
      <span class="cell-idx">[${i}]</span>
    </div>
  `).join('');
}

function renderVars(vars) {
  document.getElementById('varsRow').innerHTML = Object.entries(vars).map(([k,v]) =>
    `<div class="var-chip"><span class="var-name">${k}</span><span class="var-eq">=</span><span class="var-val">${v}</span></div>`
  ).join('') || '<span style="color:#374151;font-size:11px">Chưa có biến</span>';
}

function renderStep(idx) {
  const s = STEPS[idx];
  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  const al = document.getElementById('line-' + s.line);
  if (al) { al.classList.add('active'); al.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  document.getElementById('explanation').innerHTML = s.explain;
  document.getElementById('outputBox').textContent = s.output;
  renderArray(s.active, s.visited);
  renderVars(s.vars);
  document.getElementById('stepCounter').textContent = `${idx+1} / ${STEPS.length}`;
  document.getElementById('slider').value = idx;
}

function goToStep(idx) { current = Math.max(0, Math.min(STEPS.length - 1, idx)); renderStep(current); }
function goNext() { if (current < STEPS.length - 1) goToStep(current + 1); else stopPlay(); }
function goPrev() { goToStep(current - 1); }
function goFirst() { goToStep(0); }
function togglePlay() { playing ? stopPlay() : startPlay(); }
function startPlay() {
  playing = true;
  document.getElementById('playBtn').textContent = '⏸ Dừng';
  const speed = parseInt(document.getElementById('speedSelect').value);
  timer = setInterval(() => { if (current >= STEPS.length - 1) { stopPlay(); return; } goNext(); }, speed);
}
function stopPlay() { playing = false; clearInterval(timer); document.getElementById('playBtn').textContent = '▶ Chạy'; }

renderCode();
document.getElementById('slider').max = STEPS.length - 1;
document.getElementById('sliderMax').textContent = STEPS.length - 1;
goToStep(0);
</script>
</body>
</html>
