<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ Visualizer - Da hinh</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Be Vietnam Pro', sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .container {
    width: 100%;
    max-width: 900px;
    background: #1a1d2e;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #2d3154;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: #13152a;
    border-bottom: 1px solid #2d3154;
    flex-wrap: wrap;
  }

  .toolbar-title {
    font-size: 13px;
    font-weight: 600;
    color: #a78bfa;
    letter-spacing: 0.05em;
    margin-right: 4px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 500;
    transition: all 0.15s;
  }

  .btn-icon {
    padding: 6px 10px;
    background: #2d3154;
    color: #94a3b8;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .btn-icon:hover { background: #3d4270; color: #e2e8f0; }

  .btn-play {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: white;
    box-shadow: 0 4px 12px rgba(124,58,237,0.4);
  }
  .btn-play:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124,58,237,0.5); }

  .speed-label {
    font-size: 12px;
    color: #64748b;
    margin-left: 4px;
  }

  .speed-select {
    background: #2d3154;
    color: #e2e8f0;
    border: 1px solid #3d4270;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: 'Be Vietnam Pro', sans-serif;
    cursor: pointer;
  }

  .step-counter {
    margin-left: auto;
    font-size: 12px;
    color: #64748b;
    font-family: 'JetBrains Mono', monospace;
    background: #2d3154;
    padding: 5px 10px;
    border-radius: 6px;
  }

  .main {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    min-height: 320px;
  }

  .code-panel {
    border-right: 1px solid #2d3154;
    overflow-y: auto;
    max-height: 460px;
  }

  .code-lines {
    padding: 12px 0;
  }

  .code-line {
    display: flex;
    align-items: center;
    padding: 3px 0;
    transition: background 0.2s;
    border-left: 3px solid transparent;
  }

  .code-line.active {
    background: rgba(124, 58, 237, 0.15);
    border-left-color: #a855f7;
  }

  .line-num {
    width: 40px;
    text-align: right;
    padding-right: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #374151;
    flex-shrink: 0;
    user-select: none;
  }

  .code-line.active .line-num { color: #7c3aed; }

  .line-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #cbd5e1;
    white-space: pre;
  }

  .kw { color: #c084fc; }
  .fn { color: #60a5fa; }
  .nu { color: #fb923c; }
  .st { color: #4ade80; }
  .cm { color: #475569; font-style: italic; }
  .op { color: #94a3b8; }
  .cl { color: #f472b6; }

  .info-panel {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #a855f7;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #a855f7;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .explanation {
    font-size: 13.5px;
    line-height: 1.7;
    color: #cbd5e1;
  }

  .vars-title {
    font-size: 11px;
    font-weight: 600;
    color: #475569;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .vars-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .var-chip {
    background: #2d3154;
    border: 1px solid #3d4270;
    border-radius: 8px;
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .var-name { color: #60a5fa; }
  .var-eq { color: #475569; margin: 0 4px; }
  .var-val { color: #fb923c; font-weight: 700; }

  .output-box {
    background: #0f1117;
    border: 1px solid #2d3154;
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #4ade80;
    min-height: 60px;
    white-space: pre-line;
  }

  .output-label {
    font-size: 11px;
    color: #475569;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .slider-bar {
    padding: 12px 16px;
    background: #13152a;
    border-top: 1px solid #2d3154;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .slider-bar input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: #2d3154;
    border-radius: 2px;
    outline: none;
  }

  .slider-bar input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #7c3aed;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(124,58,237,0.6);
  }

  .slider-label { font-size: 11px; color: #475569; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="container">
  <div class="toolbar">
    <span class="toolbar-title">⚡ Trực quan hoá</span>
    <button class="btn-icon" onclick="goFirst()" title="Đầu">⏮</button>
    <button class="btn-icon" onclick="goPrev()" title="Trước">◀</button>
    <button class="btn btn-play" onclick="togglePlay()" id="playBtn">▶ Chạy</button>
    <button class="btn-icon" onclick="goNext()" title="Tiếp">▶</button>
    <span class="speed-label">Tốc độ</span>
    <select class="speed-select" id="speedSelect">
      <option value="1200">🐢 Chậm</option>
      <option value="700" selected>⚡ Bình thường</option>
      <option value="300">🚀 Nhanh</option>
    </select>
    <span class="step-counter" id="stepCounter">1 / 1</span>
  </div>

  <div class="main">
    <div class="code-panel">
      <div class="code-lines" id="codeLines"></div>
    </div>
    <div class="info-panel">
      <div class="status-badge"><div class="status-dot"></div><span id="statusTxt">ĐANG THỰC THI</span></div>
      <div class="explanation" id="explanation">Chọn bước để bắt đầu.</div>
      <div class="vars-title">Biến số / Con trỏ</div>
      <div class="vars-grid" id="varsGrid"></div>
      <div class="output-label">Output</div>
      <div class="output-box" id="outputBox"></div>
    </div>
  </div>

  <div class="slider-bar">
    <span class="slider-label" id="sliderMin">0</span>
    <input type="range" id="slider" min="0" value="0" oninput="goToStep(parseInt(this.value))">
    <span class="slider-label" id="sliderMax">0</span>
  </div>
</div>

<script>
const STEPS = [
  {
    line: 25,
    explain: "Bắt đầu hàm <b>main()</b>.",
    vars: {},
    output: ""
  },
  {
    line: 26,
    explain: "Khai báo con trỏ <b>Dongvat* dv</b> — con trỏ kiểu lớp cha, chưa trỏ tới đâu cả.",
    vars: { dv: '(chưa trỏ)' },
    output: ""
  },
  {
    line: 27,
    explain: "Tạo đối tượng <b>Cho c</b>.",
    vars: { dv: '(chưa trỏ)', c: 'Cho' },
    output: ""
  },
  {
    line: 28,
    explain: "Tạo đối tượng <b>Meo m</b>.",
    vars: { dv: '(chưa trỏ)', c: 'Cho', m: 'Meo' },
    output: ""
  },
  {
    line: 30,
    explain: "Gán <b>dv = &c</b> — con trỏ <code>dv</code> giờ trỏ tới đối tượng <code>Cho</code>.",
    vars: { dv: '→ c (Cho)' },
    output: ""
  },
  {
    line: 31,
    explain: "Gọi <b>dv-&gt;keu()</b>. Vì <code>keu()</code> là <b>virtual</b>, C++ không quan tâm <code>dv</code> khai báo kiểu <code>Dongvat*</code> — nó tự tìm đúng phiên bản của <b>đối tượng thật sự</b> (Cho) để chạy.",
    vars: { dv: '→ c (Cho)' },
    output: "Gau gau!"
  },
  {
    line: 33,
    explain: "Gán <b>dv = &m</b> — giờ <code>dv</code> trỏ tới đối tượng <code>Meo</code> thay vì <code>Cho</code>.",
    vars: { dv: '→ m (Meo)' },
    output: "Gau gau!"
  },
  {
    line: 34,
    explain: "Gọi lại <b>dv-&gt;keu()</b> — cùng 1 dòng code, nhưng lần này chạy phiên bản của <code>Meo</code>. Đây chính là <b>đa hình (polymorphism)</b>: cùng lời gọi, kết quả khác nhau tùy đối tượng thật.",
    vars: { dv: '→ m (Meo)' },
    output: "Gau gau!\nMeo meo!"
  },
  {
    line: 36,
    explain: "Hàm <b>return 0</b> — kết thúc chương trình.",
    vars: { dv: '→ m (Meo)' },
    output: "Gau gau!\nMeo meo!"
  },
  {
    line: 37,
    explain: "✅ <b>Chương trình kết thúc!</b> Nhờ từ khóa <code>virtual</code>, con trỏ lớp cha <code>Dongvat*</code> gọi đúng hàm <code>keu()</code> của từng lớp con — không cần biết trước đó là Cho hay Meo.",
    vars: { dv: '→ m (Meo)' },
    output: "Gau gau!\nMeo meo!"
  }
];

const CODE = [
  { text: '#include <iostream>', html: '<span class="kw">#include</span> <span class="st">&lt;iostream&gt;</span>' },
  { text: 'using namespace std;', html: '<span class="kw">using namespace</span> std;' },
  { text: '', html: '' },
  { text: 'class Dongvat {', html: '<span class="kw">class</span> <span class="cl">Dongvat</span> {' },
  { text: 'public:', html: '<span class="kw">public</span>:' },
  { text: '    virtual void keu() {', html: '    <span class="kw">virtual</span> <span class="kw">void</span> <span class="fn">keu</span>() {' },
  { text: '        cout << "Dong vat phat ra tieng keu" << endl;', html: '        <span class="fn">cout</span> <span class="op">&lt;&lt;</span> <span class="st">"Dong vat phat ra tieng keu"</span> <span class="op">&lt;&lt;</span> endl;' },
  { text: '    }', html: '    }' },
  { text: '};', html: '};' },
  { text: '', html: '' },
  { text: 'class Cho : public Dongvat {', html: '<span class="kw">class</span> <span class="cl">Cho</span> : <span class="kw">public</span> <span class="cl">Dongvat</span> {' },
  { text: 'public:', html: '<span class="kw">public</span>:' },
  { text: '    void keu() override {', html: '    <span class="kw">void</span> <span class="fn">keu</span>() <span class="kw">override</span> {' },
  { text: '        cout << "Gau gau!" << endl;', html: '        <span class="fn">cout</span> <span class="op">&lt;&lt;</span> <span class="st">"Gau gau!"</span> <span class="op">&lt;&lt;</span> endl;' },
  { text: '    }', html: '    }' },
  { text: '};', html: '};' },
  { text: '', html: '' },
  { text: 'class Meo : public Dongvat {', html: '<span class="kw">class</span> <span class="cl">Meo</span> : <span class="kw">public</span> <span class="cl">Dongvat</span> {' },
  { text: 'public:', html: '<span class="kw">public</span>:' },
  { text: '    void keu() override {', html: '    <span class="kw">void</span> <span class="fn">keu</span>() <span class="kw">override</span> {' },
  { text: '        cout << "Meo meo!" << endl;', html: '        <span class="fn">cout</span> <span class="op">&lt;&lt;</span> <span class="st">"Meo meo!"</span> <span class="op">&lt;&lt;</span> endl;' },
  { text: '    }', html: '    }' },
  { text: '};', html: '};' },
  { text: '', html: '' },
  { text: 'int main() {', html: '<span class="kw">int</span> <span class="fn">main</span>() {' },
  { text: '    Dongvat* dv;', html: '    <span class="cl">Dongvat</span>* dv;' },
  { text: '    Cho c;', html: '    <span class="cl">Cho</span> c;' },
  { text: '    Meo m;', html: '    <span class="cl">Meo</span> m;' },
  { text: '', html: '' },
  { text: '    dv = &c;', html: '    dv = &amp;c;' },
  { text: '    dv->keu();', html: '    dv-&gt;<span class="fn">keu</span>();' },
  { text: '', html: '' },
  { text: '    dv = &m;', html: '    dv = &amp;m;' },
  { text: '    dv->keu();', html: '    dv-&gt;<span class="fn">keu</span>();' },
  { text: '', html: '' },
  { text: '    return 0;', html: '    <span class="kw">return</span> <span class="nu">0</span>;' },
  { text: '}', html: '}' },
];

let current = 0;
let playing = false;
let timer = null;

function renderCode() {
  const el = document.getElementById('codeLines');
  el.innerHTML = CODE.map((line, i) => `
    <div class="code-line" id="line-${i+1}">
      <span class="line-num">${i+1}</span>
      <span class="line-code">${line.html || '&nbsp;'}</span>
    </div>
  `).join('');
}

function renderStep(idx) {
  const step = STEPS[idx];
  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  const activeLine = document.getElementById('line-' + step.line);
  if (activeLine) {
    activeLine.classList.add('active');
    activeLine.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  document.getElementById('explanation').innerHTML = step.explain;
  document.getElementById('outputBox').textContent = step.output;
  const grid = document.getElementById('varsGrid');
  grid.innerHTML = Object.entries(step.vars).map(([k,v]) =>
    `<div class="var-chip"><span class="var-name">${k}</span><span class="var-eq">=</span><span class="var-val">${v}</span></div>`
  ).join('') || '<span style="color:#374151;font-size:12px">Chưa có biến</span>';
  document.getElementById('stepCounter').textContent = `${idx+1} / ${STEPS.length}`;
  document.getElementById('slider').value = idx;
}

function goToStep(idx) {
  current = Math.max(0, Math.min(STEPS.length - 1, idx));
  renderStep(current);
}

function goNext() {
  if (current < STEPS.length - 1) goToStep(current + 1);
  else stopPlay();
}

function goPrev() { goToStep(current - 1); }
function goFirst() { goToStep(0); }

function togglePlay() {
  playing ? stopPlay() : startPlay();
}

function startPlay() {
  playing = true;
  document.getElementById('playBtn').textContent = '⏸ Dừng';
  const speed = parseInt(document.getElementById('speedSelect').value);
  timer = setInterval(() => {
    if (current >= STEPS.length - 1) { stopPlay(); return; }
    goNext();
  }, speed);
}

function stopPlay() {
  playing = false;
  clearInterval(timer);
  document.getElementById('playBtn').textContent = '▶ Chạy';
}

renderCode();
const slider = document.getElementById('slider');
slider.max = STEPS.length - 1;
document.getElementById('sliderMax').textContent = STEPS.length - 1;
goToStep(0);
</script>
</body>
</html>
